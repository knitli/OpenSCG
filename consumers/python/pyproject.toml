[project]
name = "openscg-consumer"
version = "0.1.0"
description = "An independent OpenSCG consumer written from the published schema, specification and fixtures only. Used to test that those materials are sufficient."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "rfc3986-validator>=0.1.1",
  "asn1crypto>=1.5.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openscg_consumer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
